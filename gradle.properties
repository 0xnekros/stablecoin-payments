# Gradle saves the result of the configuration phase and skips it on the next run
# if no build script or input has changed. It also fails the build if your
# build logic does things that break this (e.g. touching `project` inside a task action).
org.gradle.configuration-cache=true

# Reuses task outputs (compiled classes, test results) when the inputs are
# the same, even after `clean` or on a different branch.
org.gradle.caching=true

# Runs tasks from different modules (ledger, app) in parallel when they don't depend on each other.
org.gradle.parallel=true